{% extends "base.html" %}

{% block title %}
ログイン
{% endblock %}

{% block content %}
<style>
    .login-container{
        max-width:400px;
        margin:50px auto;
        background:#fff;
        padding:30px;
        border-radius:10px;
        box-shadow:0 4px 10px rgba(0,0,0,.15);
    }

    .login-container h2{
        text-align:center;
        margin-bottom:25px;
        color:#d32f2f;
    }

    .login-container p{
        margin-bottom:15px;
    }

    .login-container label{
        display:block;
        margin-bottom:6px;
        font-weight:bold;
    }

    .login-container input{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:6px;
        box-sizing:border-box;
        font-size:16px;
    }

    .login-container button{
        width:100%;
        padding:12px;
        margin-top:20px;
        border:none;
        border-radius:6px;
        background:#d32f2f;
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:.2s;
    }

    .login-container button:hover{
        background:#b71c1c;
    }

    .errorlist{
        color:red;
        list-style:none;
        padding:0;
        margin-bottom:10px;
    }

    .helptext{
        display:none;
    }
</style>

<div class="login-container">
    <h2>ログイン</h2>

<form method="post">
    {% csrf_token %}

    <p>
        <label for="id_username">ユーザー名</label>
        {{ form.username }}
    </p>

    <p>
        <label for="id_password">パスワード</label>
        {{ form.password }}
    </p>

    <button type="submit">ログイン</button>

    <p style="text-align:center; margin-top:20px;">
    アカウントをお持ちでない方は
    <a href="{% url 'pokemonTeams:signup' %}">新規登録</a>
    </p>
</form>
</div>
{% endblock %}
